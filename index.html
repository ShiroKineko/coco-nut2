<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>NOCTILUCA ARCHIVE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <div class="portrait-warning">
    <div><i class="fa-solid fa-mobile-screen-button"></i></div>
    <p>画面を横向きにしてください</p>
    <small>PLEASE ROTATE YOUR DEVICE</small>
  </div>

  <header class="topbar">
    <a class="brand" href="#home" aria-label="ホーム">
      <span class="brand-mark">N.</span>
      <span>NOCTILUCA <small>ARCHIVE</small></span>
    </a>
    <div class="top-meta"><span class="live-dot"></span> FICTIONAL OBJECT DATABASE <time id="clock"></time></div>
  </header>

  <main class="workspace">
    <section class="article-stage" aria-live="polite">
      <div class="article-wrap" id="article">
        <div class="eyebrow">WELCOME TO THE ARCHIVE <span>— 000</span></div>
        <h1>記録されていないものを、<br>ここに記録する。</h1>
        <p class="lead">NOCTILUCA ARCHIVEは、架空の世界に存在する場所・道具・生物・現象を収集する小さな百科事典です。</p>
        <div class="home-rule"></div>
        <div class="home-bottom">
          <span>右側のリングを回転させて項目を選択</span>
          <span class="scroll-hint">TURN THE RING <i class="fa-solid fa-arrow-right"></i></span>
        </div>
      </div>
    </section>

    <aside class="ring-zone" aria-label="ページナビゲーション">
      <div class="ring" id="ring">
        <div class="ring-track"></div>
        <div class="ring-items" id="ringItems"></div>
      </div>
      <div class="ring-center-mark" aria-hidden="true"></div>
      <div class="selection-pointer" aria-hidden="true"><span></span></div>
      <div class="ring-caption"><span>ARCHIVE INDEX</span><b id="currentIndex">00 / 06</b></div>
    </aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
